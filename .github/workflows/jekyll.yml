# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh Google Scholar metrics at midnight in Seattle, including DST changes.
  schedule:
    - cron: '0 0 * * *'
      timezone: 'America/Los_Angeles'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    outputs:
      scholar_outcome: ${{ steps.scholar.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify citation sync regression checks
        run: python -m unittest discover -s scripts -p test_sync_scholar.py
      - name: Restore last successful Scholar snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/scholar.json
          key: scholar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scholar-v1-
      - name: Sync Google Scholar citations through SerpApi
        id: scholar
        continue-on-error: true
        run: python scripts/sync_scholar.py --source serpapi --require-fresh
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      - name: Save last successful Scholar snapshot
        if: steps.scholar.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/scholar.json
          key: scholar-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Setup Ruby
        id: ruby_setup
        continue-on-error: true
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Wait before retrying Ruby setup
        if: steps.ruby_setup.outcome == 'failure'
        run: sleep 30
      - name: Retry Ruby setup
        id: ruby_retry
        if: steps.ruby_setup.outcome == 'failure'
        continue-on-error: true
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Wait before the final Ruby setup attempt
        if: steps.ruby_retry.outcome == 'failure'
        run: sleep 120
      - name: Final Ruby setup attempt
        id: ruby_final
        if: steps.ruby_retry.outcome == 'failure'
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report citation sync failure
        if: needs.build.outputs.scholar_outcome == 'failure'
        run: |
          echo "::error::SerpApi synchronization failed. The published site retains its last valid citation snapshot. Check the build job summary."
          exit 1
