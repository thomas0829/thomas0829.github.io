# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh Google Scholar metrics through SerpApi daily (07:23 UTC).
  schedule:
    - cron: '23 7 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify citation sync regression checks
        run: python -m unittest discover -s scripts -p test_sync_scholar.py
      - name: Restore last successful Scholar snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/scholar.json
          key: scholar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scholar-v1-
      - name: Sync Google Scholar citations through SerpApi
        id: sync
        continue-on-error: true
        run: python scripts/sync_scholar.py --source serpapi --require-fresh
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      - name: Save last successful Scholar snapshot
        if: steps.sync.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/scholar.json
          key: scholar-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Scholar snapshot for the site build
        if: steps.sync.outcome == 'success' || steps.sync.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: scholar-snapshot
          path: _data/scholar.json
          if-no-files-found: error
          retention-days: 1
      - name: Report citation sync failure
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::SerpApi synchronization failed. The site will retain its last valid citation snapshot. Check the Scholar job summary."
          exit 1

  # Build job
  build:
    needs: scholar
    # Content updates can still deploy with saved metrics during an API outage.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download the refreshed or last valid Scholar snapshot
        uses: actions/download-artifact@v4
        with:
          name: scholar-snapshot
          path: _data
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
